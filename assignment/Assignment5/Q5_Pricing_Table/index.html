<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5 - Pricing Table</title>
<link rel="stylesheet" href="style5.css">
</head>
<body>
<header>
<h1>Choose Your Plan</h1>
</header>
<main class="plans">
<section class="plan">
<h2>Basic</h2>
<ul>
<li>1 Website</li>
<li>5 GB Storage</li>
</ul>
<p class="price">$5<span>/month</span></p>
<a class="btn" href="#">Choose Basic</a>
</section>
<section class="plan popular">
<h2>Standard</h2>
<ul>
<li>5 Websites</li>
<li>50 GB Storage</li>
<li>Free Domain</li>
<li>Email Support</li>
</ul>
<p class="price">$15<span>/month</span></p>
<a class="btn" href="#">Choose Standard</a>
</section>
<section class="plan">
<h2>Premium</h2>
<ul>
<li>Unlimited Websites</li>
<li>500 GB Storage</li>
<li>Free Domain</li>
</ul>
<p class="price">$30<span>/month</span></p>
<a class="btn" href="#">Choose Premium</a>
</section>
</main>
</body>
</html>
