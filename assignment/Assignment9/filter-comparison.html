<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Filter Comparison</title>
 <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>
 <header><h1>Before &amp; After</h1></header>
 <main>
 <section class="compare">
 <figure>
 <img src="images/img4.png" alt="Original image">
 <figcaption>Before (original)</figcaption>
 </figure>
 <figure>
 <img class="filtered" src="images/img4.png" alt="Image with brightness and contrast filter">
 <figcaption>After (brightness + contrast)</figcaption>
 </figure>
 </section>
 </main>
 <footer><p>Hover over the right image to fade the filter away.</p></footer>
</body>
</html>
