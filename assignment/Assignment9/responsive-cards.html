<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Responsive Cards</title>
 <link rel="stylesheet" href="responsive-cards.css">
</head>
<body>
 <header><h1>Responsive Cards</h1></header>
 <main>
 <section class="cards">
 <article class="card"><h2>Card 1</h2><p>Desktop shows 4 columns.</p></article>
 <article class="card"><h2>Card 2</h2><p>Tablet shows 2 columns.</p></article>
 <article class="card"><h2>Card 3</h2><p>Mobile shows 1 column.</p></article>
 <article class="card"><h2>Card 4</h2><p>Hover to change colour.</p></article>
 </section>
 </main>
 <footer><p>Resize the window to see the layout change.</p></footer>
</body>
</html>
