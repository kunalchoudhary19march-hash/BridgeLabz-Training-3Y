<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Responsive Image Filter Gallery</title>
 <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>
 <header><h1>Image Filter Gallery</h1></header>
 <main>
 <section class="gallery">
 <figure><img class="blur" src="images/img1.png" alt="Sunrise"><figcaption>blur(3px)</figcaption></figure>
 <figure><img class="grayscale" src="images/img2.png" alt="Blue sky"><figcaption>grayscale(100%)</figcaption></figure>
 <figure><img class="sepia" src="images/img3.png" alt="Green valley"><figcaption>sepia(100%)</figcaption></figure>
 <figure><img class="brightness" src="images/img4.png" alt="Golden hour"><figcaption>brightness(50%)</figcaption></figure>
 <figure><img class="contrast" src="images/img5.png" alt="Pink dusk"><figcaption>contrast(200%)</figcaption></figure>
 <figure><img class="hue" src="images/img6.png" alt="Ocean view"><figcaption>hue-rotate(120deg)</figcaption></figure>
 </section>
 </main>
 <footer><p>Hover over an image to remove its filter.</p></footer>
</body>
</html>
