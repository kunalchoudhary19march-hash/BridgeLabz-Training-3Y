<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Filter Cards with Animation</title>
 <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>
 <header><h1>Our Team</h1></header>
 <main>
 <section class="cards">
 <article class="card">
 <img class="gray" src="images/img1.png" alt="Profile picture of Alice">
 <h2>Alice</h2>
 <p>Web Designer</p>
 </article>
 <article class="card">
 <img class="sepia" src="images/img2.png" alt="Profile picture of Ravi">
 <h2>Ravi</h2>
 <p>Front-end Developer</p>
 </article>
 <article class="card">
 <img class="gray" src="images/img3.png" alt="Profile picture of Maria">
 <h2>Maria</h2>
 <p>UX Researcher</p>
 </article>
 </section>
 </main>
 <footer><p>Hover over a card.</p></footer>
</body>
</html>
