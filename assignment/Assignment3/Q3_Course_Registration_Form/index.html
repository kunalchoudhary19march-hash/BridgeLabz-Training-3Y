<!DOCTYPE html>
<html>
<head>
<title>Course Registration Form</title>
</head>
<body>
<h1>Course Registration</h1>
<!-- Fieldset groups the personal detail fields -->
<fieldset>
<legend>Personal Details</legend>
<label for="name">Name:</label>
<input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>
<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
<label for="course">Select Course:</label>
<select id="course" name="course">
<option value="html">HTML Basics</option>
<option value="css">CSS Fundamentals</option>
<option value="js">JavaScript Essentials</option>
<option value="python">Python Programming</option>
</select>
</fieldset>
<br>
<!-- Table showing available course schedules -->
<h2>Available Course Schedules</h2>
<table border="1" cellpadding="8">
<tr>
<th>Day</th>
<th>Time</th>
<th>Instructor</th>
</tr>
<tr>
<td>Monday</td>
<td>10:00 AM - 11:30 AM</td>
<td>Mr. Sharma</td>
</tr>
<tr>
<td>Wednesday</td>
<td>2:00 PM - 3:30 PM</td>
<td>Ms. Verma</td>
</tr>
<tr>
<td>Friday</td>
<td>11:00 AM - 12:30 PM</td>
<td>Mr. Gupta</td>
</tr>
</table>
</body>
</html>
