<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="450">
  <defs>
    <linearGradient id="maldivesSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="60%" stop-color="#b3e5fc" />
      <stop offset="100%" stop-color="#fff9c4" />
    </linearGradient>
    <linearGradient id="maldivesSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="50%" stop-color="#0097a7" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#maldivesSky)" />
  <!-- Sun -->
  <circle cx="850" cy="140" r="50" fill="#fff59d" />
  <!-- Ocean -->
  <rect y="260" width="1200" height="190" fill="url(#maldivesSea)" />
  <!-- Sand spit -->
  <path d="M 0 450 Q 350 360 700 450 Z" fill="#ffe082" />
  <!-- Palm tree 1 -->
  <path d="M 220 420 Q 250 320 280 230" stroke="#795548" stroke-width="12" fill="none" stroke-linecap="round" />
  <ellipse cx="290" cy="225" rx="55" ry="16" fill="#2e7d32" transform="rotate(-30 290 225)" />
  <ellipse cx="270" cy="225" rx="55" ry="16" fill="#388e3c" transform="rotate(20 270 225)" />
  <ellipse cx="295" cy="240" rx="45" ry="14" fill="#43a047" transform="rotate(60 295 240)" />
  <!-- Palm tree 2 -->
  <path d="M 160 440 Q 180 350 190 270" stroke="#6d4c41" stroke-width="9" fill="none" stroke-linecap="round" />
  <ellipse cx="195" cy="265" rx="45" ry="14" fill="#2e7d32" transform="rotate(-40 195 265)" />
  <ellipse cx="180" cy="265" rx="45" ry="14" fill="#388e3c" transform="rotate(30 180 265)" />
</svg>
