<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q6 - Notifications Dashboard</title>
<!-- Bootstrap 5 CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Our own CSS (loaded after Bootstrap so it can override it) -->
<link rel="stylesheet" href="style6.css">
</head>
<body class="bg-light">
<header class="bg-dark text-white text-center py-3"><h1 class="h3 mb-0">Notification Center</h1></header>
<main class="container py-4">
<!-- card groups the alerts neatly -->
<div class="card shadow-sm">
<div class="card-header fw-bold">Latest Notifications</div>
<div class="card-body">
<div class="alert alert-success" role="alert"><strong>New message:</strong> Priya sent you a file.</div>
<div class="alert alert-info" role="alert"><strong>Tip:</strong> You can customise your dashboard from
 Settings.</div>
<div class="alert alert-danger" role="alert"><strong>Warning:</strong> Your storage is almost full.</div>
<!-- alert-dismissible + btn-close = alert that can be closed (needs Bootstrap JS) -->
<div class="alert alert-warning alert-dismissible fade show" role="alert">
<strong>Reminder:</strong> Team meeting starts at 4 PM.
<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
</div>
</div>
<!-- Summary well: bg-light + border + padding -->
<section class="well bg-light border rounded p-4 mt-4">
<h2 class="h5">Summary</h2>
<p class="mb-0">You have <strong>1</strong> new message, <strong>1</strong> tip and <strong>1</strong>
 warning today.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
