<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q7 - Task Tracker</title>
<!-- Bootstrap 5 CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Our own CSS (loaded after Bootstrap so it can override it) -->
<link rel="stylesheet" href="style7.css">
</head>
<body class="bg-light">
<header class="bg-primary text-white py-3">
<div class="container d-flex justify-content-between align-items-center">
<h1 class="h3 mb-0">Task Tracker</h1>
<!-- badge counter showing pending tasks -->
<span class="fs-6">Pending <span class="badge bg-danger">5</span></span>
</div>
</header>
<main class="container py-4">
<ul class="list-group shadow-sm mb-4">
<li class="list-group-item d-flex justify-content-between align-items-center"><span>Finish Bootstrap
 assignment</span><span class="badge bg-danger rounded-pill">High</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center"><span>Prepare project
 report</span><span class="badge bg-danger rounded-pill">High</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center"><span>Review pull
 requests</span><span class="badge bg-warning text-dark rounded-pill">Medium</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center"><span>Update portfolio
 website</span><span class="badge bg-warning text-dark rounded-pill">Medium</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center"><span>Read CSS grid
 article</span><span class="badge bg-success rounded-pill">Low</span></li>
</ul>
<!-- Button with an embedded badge -->
<button type="button" class="btn btn-success">Completed <span class="badge text-bg-light">3</span></button>
</main>
<footer class="bg-dark text-white text-center py-3"><small>&copy; 2026 Task Tracker</small></footer>
</body></html>
