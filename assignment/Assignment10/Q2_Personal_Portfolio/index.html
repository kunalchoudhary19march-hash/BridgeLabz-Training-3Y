<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2 - Personal Portfolio</title>
<!-- Bootstrap 5 CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Our own CSS (loaded after Bootstrap so it can override it) -->
<link rel="stylesheet" href="style2.css">
</head>
<body class="bg-light text-dark"> <!-- bg-light + text-dark = background/text colour utilities -->
<header class="bg-dark text-white text-center p-5"> <!-- p-5 = large padding -->
<h1 class="fw-bold">Kunal Choudhary</h1> <!-- fw-bold = bold text -->
<p class="lead mb-0">Web Developer &amp; UI Enthusiast</p>
</header>
<main class="container text-center"> <!-- container + text-center = centred layout -->
<section class="mt-4 mb-3"> <!-- mt-4 / mb-3 = margin top / bottom -->
<!-- img-fluid = responsive image, rounded-circle = round shape -->
<img src="images/profile.svg" alt="Profile photo" class="img-fluid rounded-circle my-4 profile">
<p class="mx-auto about">I build clean, responsive websites with HTML, CSS and Bootstrap. I love turning
 ideas into simple, useful web pages.</p>
<a href="#contact" class="btn btn-primary me-2">Hire Me</a>
<a href="#" class="btn btn-outline-dark">Download CV</a>
</section>
<section id="contact" class="p-5 mt-4 mb-3 bg-white border rounded mx-auto form-box">
<h2 class="h4 mb-3">Contact Me</h2>
<form action="#" method="post" class="text-start">
<div class="mb-3"><label for="n" class="form-label">Name</label><input type="text" id="n"
 class="form-control" placeholder="Your name"></div>
<div class="mb-3"><label for="e" class="form-label">Email</label><input type="email" id="e"
 class="form-control" placeholder="you@example.com"></div>
<div class="mb-3"><label for="m" class="form-label">Message</label><textarea id="m" class="form-control"
 rows="3"></textarea></div>
<button type="submit" class="btn btn-success w-100">Send</button>
</form>
</section>
</main>
<footer class="bg-dark text-white text-center p-3 mt-4"><small>&copy; 2026 Kunal Choudhary</small></footer>
</body></html>
