<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="en">
<head>
<!-- Q4: Frameset layout with a navigation frame on top and a
welcome message frame on the bottom -->
<title>Q4 - Frameset Layout</title>
</head>
<!-- The frameset splits the browser window into two rows:
20% for the navigation links and 80% for the welcome message -->
<frameset rows="20%,80%">
<frame src="q4_nav.html" name="topFrame" title="Navigation Frame">
<frame src="q4_welcome.html" name="bottomFrame" title="Welcome Frame">
</frameset>
</html>
