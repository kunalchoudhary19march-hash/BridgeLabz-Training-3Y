<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q16: Demonstrating URI encoding in a hyperlink -->
<meta charset="UTF-8">
<title>Q16 - URI Encoding</title>
</head>
<body>
<h1>URI Encoding Demonstration</h1>
<p>Original URL (contains a space and an ampersand, which are special characters):</p>
<p>https://example.com/search?query=HTML & CSS</p>
<p>Correctly encoded URL (spaces replaced with %20, ampersand encoded as %26):</p>
<a href="https://example.com/search?query=HTML%20%26%20CSS">
https://example.com/search?query=HTML%20%26%20CSS
</a>
</body>
</html>
