<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q7: Login Form with a hidden CSRF token -->
<meta charset="UTF-8">
<title>Q7 - Login Form</title>
</head>
<body>
<h1>Login Form</h1>
<form action="#" method="post">
<label for="username">Username:</label><br>
<input type="text" id="username" name="username" required><br><br>
<label for="password">Password:</label><br>
<input type="password" id="password" name="password" required><br><br>
<!-- A CSRF (Cross-Site Request Forgery) token is a unique, secret
value generated by the server and embedded in the form. When
the form is submitted, the server checks that this token
matches the one it issued. This proves the request genuinely
came from the site's own form and not from a malicious
external site tricking the user's browser into submitting it. -->
<input type="hidden" name="csrf_token" value="a1b2c3d4e5f6dummy">
<input type="submit" value="Login">
</form>
</body>
</html>
