<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q9: File Upload Form restricted to .jpg and .png files -->
<meta charset="UTF-8">
<title>Q9 - File Upload Form</title>
</head>
<body>
<h1>Upload Your Photo</h1>
<form action="#" method="post" enctype="multipart/form-data">
<label for="photo">Choose an image file:</label><br>
<input type="file" id="photo" name="photo" accept=".jpg,.png" required><br><br>
<input type="submit" value="Upload">
</form>
<p>Note: Only image files with the .jpg or .png extension are allowed to be uploaded.</p>
</body>
</html>
