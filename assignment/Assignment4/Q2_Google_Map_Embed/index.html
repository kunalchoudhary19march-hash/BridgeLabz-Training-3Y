<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q2: Embedding a Google Map using an iframe -->
<meta charset="UTF-8">
<title>Q2 - Google Map Embed</title>
</head>
<body>
<h1>Location of My City</h1>
<!-- The loading="lazy" attribute tells the browser to delay loading
the iframe's content until it is about to become visible in the
viewport. This improves initial page load speed and saves
bandwidth if the user never scrolls down to the map. -->
<iframe
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3556.9!2d77.6737!3d27.4924!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1"
title="Map showing Mathura, Uttar Pradesh"
width="600"
height="450"
loading="lazy">
</iframe>
</body>
</html>
