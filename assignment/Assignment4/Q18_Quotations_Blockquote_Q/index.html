<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q18: Long and short quotations using blockquote and q -->
<meta charset="UTF-8">
<title>Q18 - Quotations</title>
</head>
<body>
<h1>Quotations Example</h1>
<!-- Long quotation -->
<blockquote>
Education is the most powerful weapon which you can use to change
the world, and it works best when hard work &amp; dedication go
hand in hand.
</blockquote>
<!-- Short quotation inside a paragraph -->
<p>As my teacher always says, <q>practice makes a student perfect</q>, and I truly believe that.</p>
</body>
</html>
