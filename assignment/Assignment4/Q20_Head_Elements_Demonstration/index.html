<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q20: Demonstrating all important head elements -->
<!-- title: sets the text shown on the browser tab and in search results -->
<title>Q20 - Important Head Elements</title>
<!-- meta charset: defines the character encoding used by the document -->
<meta charset="UTF-8">
<!-- meta description: gives search engines a summary of the page content -->
<meta name="description" content="A demonstration page showing important HTML head elements.">
<!-- meta author: states who created the document -->
<meta name="author" content="Kunal Kumar Singh">
<!-- base: sets the default base URL for all relative links and resources on the page -->
<base href="https://example.com/">
<!-- link: connects an external resource, here a favicon icon, to the page -->
<link rel="icon" href="favicon.ico" type="image/x-icon">
<!-- style: reserved for internal CSS rules (left empty as CSS is not used here) -->
<style>
</style>
<!-- script: reserved for internal JavaScript code (left empty as JS is not used here) -->
<script>
</script>
</head>
<body>
<h1>Important Head Elements Demonstrated</h1>
<p>View the page source or the head section above to see each element explained with comments.</p>
</body>
</html>
