<!DOCTYPE html>
<html lang="en">
<head>
<!-- Q1: Embedding a YouTube video using an iframe with percentage-based sizing -->
<meta charset="UTF-8">
<title>Q1 - YouTube Video Embed</title>
</head>
<body>
<h1>My Favorite YouTube Video</h1>
<!-- Width and height are given in percentage values so the video
resizes automatically when the browser window is resized -->
<iframe
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
width="80%"
height="60%"
title="YouTube video player"
allowfullscreen>
</iframe>
</body>
</html>
