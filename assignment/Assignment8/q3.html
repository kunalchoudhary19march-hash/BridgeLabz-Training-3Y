<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header><h1>Image Showcase</h1></header>
    <main>
        <section class="gallery">
            <figure><div class="img-wrap"><img src="images/img1.png" alt="Sunrise over mountains"></div><figcaption>Sunrise</figcaption></figure>
            <figure><div class="img-wrap"><img src="images/img2.png" alt="Blue sky peaks"></div><figcaption>Blue Sky</figcaption></figure>
            <figure><div class="img-wrap"><img src="images/img3.png" alt="Green valley"></div><figcaption>Green Valley</figcaption></figure>
            <figure><div class="img-wrap"><img src="images/img4.png" alt="Golden hour"></div><figcaption>Golden Hour</figcaption></figure>
            <figure><div class="img-wrap"><img src="images/img5.png" alt="Pink dusk"></div><figcaption>Pink Dusk</figcaption></figure>
            <figure><div class="img-wrap"><img src="images/img6.png" alt="Ocean mountains"></div><figcaption>Ocean View</figcaption></figure>
        </section>
    </main>
    <footer><p>Hover over an image.</p></footer>
</body>
</html>
