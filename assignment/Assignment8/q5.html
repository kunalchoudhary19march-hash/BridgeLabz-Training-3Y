<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header><h1>Styled Button Collection</h1></header>
    <main>
        <section class="buttons">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
            <button class="btn outline">Outline</button>
            <button class="btn primary" disabled>Disabled</button>
        </section>
        <p class="hint">Hover, click, and press Tab to see the hover, active and focus styles.</p>
    </main>
    <footer><p>Button styles demo</p></footer>
</body>
</html>
