<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>
    <header><h1>Combined Effects</h1></header>
    <main>
        <section class="examples">
            <article class="example">
                <button class="grow-btn">Grow &amp; Colour</button>
                <p>Button grows and changes colour.</p>
            </article>
            <article class="example">
                <div class="spin-card" tabindex="0">Card</div>
                <p>Card rotates slightly and lifts (hover or focus).</p>
            </article>
            <article class="example">
                <a href="#" class="slide-link">Slide Link</a>
                <p>Link slides right with a shadow.</p>
            </article>
        </section>
    </main>
    <footer><p>Hover or Tab to each example.</p></footer>
</body>
</html>
