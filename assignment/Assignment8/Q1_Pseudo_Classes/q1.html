<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes Demo</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header><h1>CSS Pseudo-Classes</h1></header>
    <main>
        <section class="row">
            <article class="example">
                <a href="#" class="demo-link">Hover me</a>
                <p><code>:hover</code> applies when the mouse is over the element.</p>
            </article>
            <article class="example">
                <input type="text" class="demo-input" placeholder="Click here">
                <p><code>:focus</code> applies when the field is selected.</p>
            </article>
            <article class="example">
                <button class="demo-btn">Press me</button>
                <p><code>:active</code> applies while the button is being pressed.</p>
            </article>
            <article class="example">
                <ul class="demo-list">
                    <li>One</li>
                    <li>Two</li>
                    <li>Three</li>
                    <li>Four</li>
                </ul>
                <p><code>:nth-child(even)</code> selects every even list item.</p>
            </article>
        </section>
    </main>
    <footer><p>Try each example above.</p></footer>
</body>
</html>
