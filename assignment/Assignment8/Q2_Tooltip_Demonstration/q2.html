<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <main class="container">
        <h1>Hover to see tooltips</h1>
        <section class="items">
            <span class="tooltip">Home
                <span class="tip">Go to the home page</span>
            </span>
            <span class="tooltip">&#9829;
                <span class="tip">Add to favourites</span>
            </span>
            <span class="tooltip">HTML
                <span class="tip">HyperText Markup Language</span>
            </span>
            <span class="tooltip">CSS
                <span class="tip">Cascading Style Sheets</span>
            </span>
        </section>
    </main>
</body>
</html>
