<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main class="stage">
        <h1>CSS Animation Demonstration</h1>
        <section class="animations">
            <figure>
                <div class="box"></div>
                <figcaption>Moving box</figcaption>
            </figure>
            <figure>
                <div class="ball"></div>
                <figcaption>Bouncing ball</figcaption>
            </figure>
            <figure>
                <p class="text">Colour!</p>
                <figcaption>Colour-changing text</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
