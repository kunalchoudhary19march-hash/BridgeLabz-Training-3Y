<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demo</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Borders &amp; Padding Demonstration</h1>
  </header>
  <main>
    <!-- Section 1: border styles -->
    <section>
      <h2>Border Styles</h2>
      <div class="row">
        <div class="box solid">Solid</div>
        <div class="box dashed">Dashed</div>
        <div class="box double">Double</div>
        <div class="box groove">Groove</div>
      </div>
    </section>

    <!-- Section 2: rounded corners -->
    <section>
      <h2>Rounded Corners (border-radius)</h2>
      <div class="row">
        <div class="box round-sm">10px radius</div>
        <div class="box round-lg">30px radius</div>
        <div class="box round-circle">50%</div>
      </div>
    </section>

    <!-- Section 3: padding -->
    <section>
      <h2>Padding Values</h2>
      <div class="row">
        <div class="box pad-small">padding: 5px</div>
        <div class="box pad-medium">padding: 20px</div>
        <div class="box pad-large">padding: 40px</div>
        <div class="box pad-mixed">padding: 10px 40px</div>
      </div>
    </section>
  </main>
  <footer>
    <p>Hover over any box to see the border colour change.</p>
  </footer>
</body>
</html>
