<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>
  <main>
    <section class="row">
      <figure>
        <div class="box rotate"></div>
        <figcaption>rotate(45deg)</figcaption>
      </figure>
      <figure>
        <div class="box scale"></div>
        <figcaption>scale(1.5)</figcaption>
      </figure>
      <figure>
        <div class="box translate"></div>
        <figcaption>translate(30px, -20px)</figcaption>
      </figure>
      <figure>
        <div class="box skew"></div>
        <figcaption>skew(20deg, 10deg)</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    <p>Hover over each box to see the transformation.</p>
  </footer>
</body>
</html>
