<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <main class="container">
    <!-- Box 1: px units -->
    <section class="box box1">
      <h2>Box 1</h2>
      <p>width: 250px<br>height: 150px</p>
    </section>
    <!-- Box 2: % and vh units, min-height and max-width -->
    <section class="box box2">
      <h2>Box 2</h2>
      <p>width: 30%, max-width: 300px<br>height: 30vh, min-height: 120px</p>
    </section>
    <!-- Box 3: em units and overflow -->
    <section class="box box3">
      <h2>Box 3</h2>
      <p>width: 15em, height: 10em, overflow: auto. This paragraph has extra text so the content is longer than the box and a scrollbar appears, demonstrating the overflow property.</p>
    </section>
  </main>
</body>
</html>
